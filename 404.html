<!-- Self-contained on purpose: GitHub Pages serves this file for any unknown path, and a stylesheet linked
     relatively would miss from a nested one. Everything this page needs is in it. -->
<style>
:root{color-scheme:dark;--bg:#0F1216;--bg2:#151920;--line:#262C36;--ink:#ECEAE4;--mute:#838B99;--amber:#F3B53F;--amber-ink:#1A1200}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;padding:32px;
  font:16px/1.6 "Instrument Sans","Helvetica Neue",Arial,sans-serif;display:grid;place-items:center}
main{width:min(520px,100%)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;letter-spacing:-.02em;margin-bottom:28px}
.brand span{font:500 .62rem/1 "IBM Plex Mono",Menlo,monospace;letter-spacing:.12em;border:1px solid var(--line);
  border-radius:4px;padding:3px 6px;color:var(--mute)}
.code{font:500 .72rem/1 "IBM Plex Mono",Menlo,monospace;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
h1{font-size:clamp(28px,5vw,40px);line-height:1.08;letter-spacing:-.02em;margin:12px 0 14px;text-wrap:balance}
p{color:var(--mute);margin:0 0 26px}
.links{display:flex;flex-wrap:wrap;gap:10px}
a.btn{display:inline-block;text-decoration:none;padding:11px 16px;border-radius:10px;font-weight:600;font-size:.95rem}
a.primary{background:var(--amber);color:var(--amber-ink)}
a.ghost{border:1px solid var(--line);color:var(--ink)}
a.btn:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="3" y="7" width="26" height="22" rx="5" fill="#F3B53F"/>
      <path d="M3 12h26v4H3z" fill="#1A1200" opacity=".85"/>
      <path d="M7 12l3.5 4M13 12l3.5 4M19 12l3.5 4" stroke="#F3B53F" stroke-width="1.6"/>
      <path d="M10 19v8M10 23l6-4M10 23l6 4" stroke="#1A1200" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    Kleo <span>MCP</span>
  </div>
  <div class="code">Error 404</div>
  <h1>There is no page here.</h1>
  <p>The link is wrong, or the page moved. Kleo itself is fine — it lives inside your assistant, not on this website.</p>
  <div class="links">
    <a class="btn primary" href="index.html">Go to Kleo</a>
    <a class="btn ghost" href="styles.html">See the styles</a>
    <a class="btn ghost" href="mailto:kleooai@gmail.com">Tell us what broke</a>
  </div>
</main>
</body>
</html>
